name: Question
description: Ask how to use a feature or understand a behaviour
labels: ["question"]
assignees: ["Ruth-mutua"]
body:
  - type: markdown
    attributes:
      value: |
        Not sure how something works? Ask here. For bugs use the Bug Report template.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Be as specific as possible — include the component and what you've already tried.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What have you tried?
      description: Docs, examples, or code you've looked at.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: JarvisCore version
      description: Run `python -c "import jarviscore; print(jarviscore.__version__)"` or provide the commit SHA.
      placeholder: "2.1.1"
    validations:
      required: false
