# docker-compose.nexus.yml
#
# JarvisCore — Local Nexus Development Stack
# ===========================================
# Runs the Nexus Broker and Gateway locally for developing connected-app
# features without a production Nexus deployment.
#
# Start it with `jarviscore nexus init` (first time) or `jarviscore nexus up`.
# Both pass the stack's secrets with --env-file ~/.jarviscore/nexus/stack.env,
# a file only your user can read. Running compose by hand needs the same flag.
#
# Who holds what, as in Nexus's own security model:
#   Broker  — the master ENCRYPTION_KEY and STATE_KEY; stores tokens encrypted.
#   Gateway — STATE_KEY and the key it presents to the Broker. No tokens.
#   Agents  — NEXUS_GATEWAY_URL and NEXUS_GATEWAY_API_KEY in the project .env.
#             Never the master key: a process that can read it can decrypt
#             every stored credential.
#
# Both services require an API key and listen on 127.0.0.1 only. With either
# open, any caller that reaches the port can list connections and read back
# their decrypted credentials.
#
# Operational notes:
# - The broker applies its own migrations on boot (AUTO_MIGRATE, on by default).
# - ALLOWED_RETURN_DOMAINS=localhost is required for local OAuth callbacks.
# - DATABASE_URL needs ?sslmode=disable for the local Postgres (no TLS in dev).
# - Healthchecks use wget: the images are busybox based and ship no curl.
# - ENCRYPTION_KEY must never change while connections exist; losing it makes
#   every stored credential unreadable.

services:
  # ── Nexus Broker ────────────────────────────────────────────────────────────
  # Runs OAuth flows, receives callbacks, encrypts and stores tokens.
  # Agents never talk to it directly; the Gateway does, with NEXUS_BROKER_API_KEY.
  nexus-broker:
    # Pinned, not :latest, so an upgrade is a decision rather than a surprise.
    image: ghcr.io/prescott-data/nexus-broker:${NEXUS_BROKER_IMAGE_TAG:-v0.6.7}
    container_name: nexus-broker
    ports:
      # Published for the browser's OAuth callback. Loopback only: the admin
      # API on this port is guarded by API_KEY, but nothing else on the network
      # has a reason to reach it. Changing the port means changing BASE_URL.
      - "${NEXUS_BIND_ADDRESS:-127.0.0.1}:${NEXUS_BROKER_PORT:-8080}:8080"
    environment:
      ENCRYPTION_KEY: "${NEXUS_ENCRYPTION_KEY:?run jarviscore nexus init}"
      STATE_KEY: "${NEXUS_STATE_KEY:?run jarviscore nexus init}"
      API_KEY: "${NEXUS_BROKER_API_KEY:?run jarviscore nexus init}"
      REQUIRE_API_KEY: "true"
      # Where the provider sends the user back after consent. Without this the
      # broker refuses to start. This exact value must be whitelisted in the
      # provider's app settings.
      BASE_URL: ${NEXUS_BROKER_BASE_URL:-http://localhost:8080}
      REDIRECT_PATH: ${NEXUS_REDIRECT_PATH:-/auth/callback}
      DATABASE_URL: postgres://nexus:nexus@nexus-db:5432/nexus?sslmode=disable
      # Defaults to the Redis this stack ships so a fresh install works on its
      # own; point NEXUS_REDIS_URL at your own instance to share one.
      REDIS_URL: ${NEXUS_REDIS_URL:-redis://nexus-redis:6379/1}
      DEFAULT_RETURN_URL: ${NEXUS_RETURN_URL:-http://localhost:8000/oauth/callback}
      ALLOWED_RETURN_DOMAINS: "localhost,127.0.0.1"
      ENFORCE_RETURN_URL: "false"
    depends_on:
      nexus-db:
        condition: service_healthy
      nexus-redis:
        condition: service_healthy
    networks:
      - nexus_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 8s

  # ── Nexus Gateway ───────────────────────────────────────────────────────────
  # What JarvisCore talks to (NEXUS_GATEWAY_URL). Every route except /health
  # and the credential-capture form needs X-API-Key: NEXUS_GATEWAY_API_KEY.
  nexus-gateway:
    image: ghcr.io/prescott-data/nexus-gateway:${NEXUS_GATEWAY_IMAGE_TAG:-v0.6.7}
    container_name: nexus-gateway
    ports:
      - "${NEXUS_BIND_ADDRESS:-127.0.0.1}:${NEXUS_GATEWAY_PORT:-8090}:8090"
    environment:
      PORT: "8090"
      BROKER_BASE_URL: http://nexus-broker:8080
      BROKER_API_KEY: "${NEXUS_BROKER_API_KEY:?run jarviscore nexus init}"
      STATE_KEY: "${NEXUS_STATE_KEY:?run jarviscore nexus init}"
      GATEWAY_REQUIRE_API_KEY: "true"
      GATEWAY_API_KEYS: "${NEXUS_GATEWAY_API_KEY:?run jarviscore nexus init}"
      REDIS_URL: ${NEXUS_REDIS_URL:-redis://nexus-redis:6379/0}
      CORS_ALLOWED_ORIGINS: "http://localhost:8000,http://localhost:3000,http://localhost:5173"
    depends_on:
      nexus-broker:
        condition: service_healthy
    networks:
      - nexus_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 8s

  # ── Nexus Database ──────────────────────────────────────────────────────────
  # Postgres for broker state. Not published: only the broker reaches it.
  nexus-db:
    image: postgres:16-alpine
    container_name: nexus-db
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    volumes:
      - nexus_db_data:/var/lib/postgresql/data
    networks:
      - nexus_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Nexus Redis ─────────────────────────────────────────────────────────────
  # Short-lived OAuth state and Gateway rate limiting.
  nexus-redis:
    image: redis:7-alpine
    container_name: nexus-redis
    networks:
      - nexus_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  nexus_net:
    # Same network name as the main jarviscore infra stack so services can be
    # shared. If that stack isn't running, compose creates it.
    name: jarviscore-framework_default
    driver: bridge

volumes:
  nexus_db_data:
    name: jarviscore_nexus_db
